# Declarative label source of truth. Edit here, push to main, and the
# "Sync labels" workflow applies the change automatically — no more
# manually recreating a label after forgetting on one repo.
#
# This intentionally does NOT delete labels that are removed from this
# file (delete-other-labels: false in the workflow) — safer default so a
# typo here can't wipe labels currently used on open issues.

- name: "area: infra"
  color: "c5def5"
  description: "Build, deploy, tooling"
- name: "area: testing"
  color: "bfdadc"
  description: "Tests"
- name: "area: ui"
  color: "0e8a16"
  description: "User interface / components"
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "javascript"
  color: "168700"
  description: "Pull requests that update javascript code"
- name: "priority: P0"
  color: "b60205"
  description: "Blocker before real users depend on this"
- name: "priority: P1"
  color: "d93f0b"
  description: "Important for reliability, security, or maintainability"
- name: "priority: P2"
  color: "fbca04"
  description: "Nice to have / low urgency"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "security"
  color: "5319e7"
  description: "Security-related"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
