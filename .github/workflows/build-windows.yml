name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - "src/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci
      - run: npm run dist:win

      - uses: actions/upload-artifact@v7
        with:
          name: vault-windows-installer
          path: release/*.exe
          retention-days: 30
